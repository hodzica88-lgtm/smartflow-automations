<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline | Varnito</title>
    <meta name="theme-color" content="#090a0f" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(212,175,55,.16), transparent 35%), #090a0f;
        color: #eef1f9;
        font: 500 16px/1.6 Poppins, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        width: min(100%, 540px);
        border: 1px solid #2a3040;
        border-radius: 24px;
        background: linear-gradient(160deg, rgba(255,255,255,.03), rgba(255,255,255,.01));
        padding: 24px;
      }
      .mark {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: rgba(255,255,255,.04);
        margin-bottom: 16px;
      }
      h1 { margin: 0 0 12px; font-size: 2rem; }
      p { margin: 0 0 12px; color: #9ea7be; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border-radius: 999px;
        background: #d4af37;
        color: #101010;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 11L19 35H29L41 11H33L24 29L15 11H7Z" fill="#D4AF37"/>
        </svg>
      </div>
      <h1>Sie sind gerade offline.</h1>
      <p>Varnito konnte die gewünschte Seite nicht laden. Sobald wieder eine Verbindung besteht, können Sie direkt in das Produkt zurückkehren.</p>
      <a href="/">Zur Startseite</a>
    </main>
  </body>
  </html>
