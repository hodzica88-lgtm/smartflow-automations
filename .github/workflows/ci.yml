name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - "**"
    paths:
      - "app/**"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon_test_placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      SUPABASE_SERVICE_ROLE_KEY: service_role_test_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit and integration tests
        run: pnpm test

      - name: Capacity fixture safety checks
        run: node --test scripts/operations/capacity-fixture.check.mjs

      - name: Capacity client safety checks
        run: python3 scripts/operations/capacity-client.check.py

      - name: Verify actual Next.js action transport
        run: node scripts/operations/action-protocol.check.mjs

      - name: Parse Windows capacity runner
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/operations/run-capacity-test.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            throw 'Capacity runner has PowerShell syntax errors.'
          }

      - name: Build
        run: pnpm build
